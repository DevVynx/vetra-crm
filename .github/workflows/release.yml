# Publishes a version of Vetra: on a tag like v0.1.0 (or v0.1.0-rc.1 for a trial), it builds the image for amd64 and arm64,
# pushes it to GHCR as 0.1.0 (and as latest, unless it is a trial) and creates the GitHub Release with the installer package.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/devvynx/vetra-crm

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag with a hyphen (v0.1.0-rc.1) is a trial: it gets its own version tag and never takes "latest".
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # The action would write the license GitHub detects (NOASSERTION, which does not know PolyForm), over the
          # one the Dockerfile sets.
          labels: |
            org.opencontainers.image.licenses=PolyForm-Shield-1.0.0
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VETRA_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the installer package
        env:
          VETRA_VERSION: ${{ steps.meta.outputs.version }}
        run: bash scripts/instalador/montar-instalador.sh

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIAL: ${{ contains(github.ref_name, '-') }}
        run: |
          flags=""
          if [ "$TRIAL" = "true" ]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/vetra-instalador.zip \
            --title "Vetra ${GITHUB_REF_NAME#v}" \
            --generate-notes $flags
