services:
  db:
    image: postgres:18-alpine
    container_name: vetra_postgres
    restart: always
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: vetra
    ports:
      - "5432:5432"
    volumes:
      - vetra_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d vetra"]
      interval: 10s
      timeout: 5s
      retries: 5

  waha:
    # Pinned to the digest of 2026.10.1, the version validated in VET-12.
    image: devlikeapro/waha:latest@sha256:2fc1787ddbd343ed2e7d59482846d1b22aa5ca134e29aa8d42d0e88c54e24779
    container_name: vetra_waha
    restart: always
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?Set WAHA_API_KEY in .env}
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_EVENTS_DOWNLOAD_MEDIA: "false"
      WAHA_API_DOWNLOAD_MEDIA: "false"
      WAHA_GOWS_DEVICE_HISTORY_SYNC_FULL_SYNC_DAYS_LIMIT: "365"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - vetra_waha_sessions:/app/.sessions

volumes:
  vetra_postgres_data:
  vetra_waha_sessions:
