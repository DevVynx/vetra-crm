services:
  db:
    image: postgres:18-alpine
    container_name: vetra_postgres
    restart: always
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: vetra
    ports:
      - "5432:5432"
    volumes:
      - vetra_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d vetra"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vetra_postgres_data:
