# The built app: only the app publishes a port. The database and WhatsApp are reached by the app through the private
# network of this file (db:5432, waha:3000), so nothing of them is open on this computer and they
# cannot clash with another Postgres or tool. Development has its own file, compose.dev.yaml, with its own
# project, containers and volumes, so the two never share data or a WhatsApp session.
# The project name is fixed, so the name of the folder Vetra is in does not change it (and so the volumes keep their names).
name: vetra-crm

services:
  db:
    image: postgres:18-alpine
    container_name: vetra_postgres
    restart: always
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: vetra
    volumes:
      - vetra_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d vetra"]
      interval: 10s
      timeout: 5s
      retries: 5

  waha:
    # Pinned to the digest of 2026.10.1, the version validated in VET-12. That image is for amd64 only: on arm64 the
    # launcher sets WAHA_IMAGE to the arm one (not verified yet).
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest@sha256:2fc1787ddbd343ed2e7d59482846d1b22aa5ca134e29aa8d42d0e88c54e24779}
    container_name: vetra_waha
    restart: always
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?Set WAHA_API_KEY in .env}
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_EVENTS_DOWNLOAD_MEDIA: "false"
      WAHA_API_DOWNLOAD_MEDIA: "false"
      WAHA_GOWS_DEVICE_HISTORY_SYNC_FULL_SYNC_DAYS_LIMIT: "365"
    volumes:
      - vetra_waha_sessions:/app/.sessions

  # Vetra itself: the API and the built web. It is in the "app" profile so that, in development,
  # `docker compose up -d` does not start a second API that would also sync WhatsApp. The
  # launcher (iniciar-vetra) starts it with --profile app.
  app:
    profiles: ["app"]
    # The same file serves both: someone who installs Vetra pulls this image (the launcher uses --no-build when there is
    # no Dockerfile next to it), and whoever has the source builds it (the launcher uses --build). VETRA_VERSION in .env
    # picks a version; without it, the latest.
    image: ghcr.io/devvynx/vetra-crm:${VETRA_VERSION:-latest}
    build: .
    container_name: vetra_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
      waha:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://dev:dev@db:5432/vetra
      FRONTEND_URL: http://localhost:4720
      API_PORT: 4720
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:?Set WAHA_API_KEY in .env}
    ports:
      # Published only on this computer: there is no login, so nothing else may reach it. 4720 is unusual
      # on purpose, so it does not clash with other programs; the launcher scripts use the same number.
      - "127.0.0.1:4720:4720"
    volumes:
      - vetra_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$API_PORT/api/profile > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  vetra_postgres_data:
  vetra_waha_sessions:
  vetra_data:
