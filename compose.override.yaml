# For development only. `docker compose` merges this file by itself, so `pnpm dev` and the database tools can
# reach the database and WhatsApp from outside Docker. The launcher (iniciar-vetra) and the release package use
# compose.yaml alone, so someone who just runs Vetra gets no port besides the app's.
#
# Only this computer: the database has a fixed development password and holds everything. If one of these
# ports clashes with something else, change it here or in .env (and DATABASE_URL / WAHA_URL to match).
services:
  db:
    ports:
      - "127.0.0.1:${VETRA_DB_PORT:-5432}:5432"

  waha:
    ports:
      - "127.0.0.1:${VETRA_WAHA_PORT:-3001}:3000"
